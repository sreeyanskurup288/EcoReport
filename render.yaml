services:
  - type: web
    name: ecoreport-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://sreeyanskurup288.github.io
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecoreport-db
          property: connectionString

databases:
  - name: ecoreport-db
    databaseName: ecoreport
    plan: free
    region: oregon
